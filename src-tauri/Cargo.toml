[package]
name = "canopy"
version = "0.1.0"
description = "複数リポジトリのブランチを 1 画面で扱う Git ツール"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "canopy_lib"
# macOS のデスクトップだけが対象なので rlib で足りる (docs/adr/0014-macos-only.md)。
# lib に分けているのは src-tauri/tests/ の統合テストから呼ぶため
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Rust の struct から TypeScript の型を生成する (docs/adr/0013-type-generation.md)
ts-rs = "12"
